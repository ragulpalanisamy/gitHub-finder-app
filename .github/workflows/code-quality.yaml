name: 🔍 Linting Checks

on:
  pull_request:
    branches: [dev, uat, main]

jobs:
  linting-checks:
    name: 🛠️ Code Linting
    runs-on: ubuntu-latest
    if: |
      !contains(fromJSON('["dev", "uat", "main"]'), github.head_ref || github.ref_name)
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔬 Run Lint Fix
        run: npm run lint

      - name: 🔍 Check Linting
        run: npm run lint:check 